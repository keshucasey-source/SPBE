paths:

  # ==========================================================================
  # AUTHENTICATION
  # ==========================================================================

  /register:
    post:
      tags:
        - Authentication

      summary: Registrasi masyarakat

      description: Membuat akun masyarakat baru.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - name
                - email
                - password
                - password_confirmation

              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Ahmad Alfin Dahlin

                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: ahmadalfind02@gmail.com

                password:
                  type: string
                  format: password
                  example: Password123!

                password_confirmation:
                  type: string
                  format: password
                  example: Password123!

      responses:

        '201':
          description: Registrasi berhasil.

        '422':
          description: Validasi gagal.


  /login:
    post:
      tags:
        - Authentication

      summary: Login

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - password

              properties:
                email:
                  type: string
                  format: email
                  example: admin@sumberporong.my.id

                password:
                  type: string
                  format: password
                  example: Password123!

      responses:

        '200':
          description: Login berhasil.

        '403':
          description: Akun dinonaktifkan.

        '422':
          description: Email atau password salah.


  /forgot-password:
    post:
      tags:
        - Authentication

      summary: Meminta reset password

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email

              properties:
                email:
                  type: string
                  format: email
                  example: ahmadalfind02@gmail.com

      responses:

        '200':
          description: Permintaan reset password diproses.

        '422':
          description: Validasi email gagal.


  /reset-password:
    post:
      tags:
        - Authentication

      summary: Reset password

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - token
                - email
                - password
                - password_confirmation

              properties:
                token:
                  type: string
                  example: reset-token-example

                email:
                  type: string
                  format: email
                  example: ahmadalfind02@gmail.com

                password:
                  type: string
                  format: password
                  example: NewPassword123!

                password_confirmation:
                  type: string
                  format: password
                  example: NewPassword123!

      responses:

        '200':
          description: Password berhasil diubah.

        '403':
          description: Akun tidak aktif.

        '422':
          description: Token tidak valid atau validasi gagal.


  /logout:
    post:
      tags:
        - Authentication

      summary: Logout

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Logout berhasil.

        '401':
          description: Tidak terautentikasi.


  /user:
    get:
      tags:
        - Authentication

      summary: Mendapatkan user yang sedang login

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Data user berhasil diambil.

        '401':
          description: Tidak terautentikasi.


  /profile:
    patch:
      tags:
        - Authentication

      summary: Memperbarui profil user

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - name
                - email

              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Ahmad Alfin Dahlin

                email:
                  type: string
                  format: email
                  example: ahmadalfind02@gmail.com

                current_password:
                  type: string
                  format: password

                new_password:
                  type: string
                  format: password

                new_password_confirmation:
                  type: string
                  format: password

      responses:

        '200':
          description: Profil berhasil diperbarui.

        '401':
          description: Tidak terautentikasi.

        '403':
          description: Akses ditolak.

        '422':
          description: Validasi gagal.


  # ==========================================================================
  # DASHBOARD
  # ==========================================================================

  /admin/dashboard:
    get:
      tags:
        - Admin Dashboard

      summary: Mendapatkan statistik dashboard Admin

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Dashboard berhasil diambil.

        '401':
          description: Tidak terautentikasi.

        '403':
          description: Tidak memiliki akses sebagai Admin atau Super Admin.


  /superadmin/dashboard:
    get:
      tags:
        - Super Admin Dashboard

      summary: Mendapatkan statistik dashboard Super Admin

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Dashboard Super Admin berhasil diambil.

        '401':
          description: Tidak terautentikasi.

        '403':
          description: Tidak memiliki akses sebagai Super Admin.


  # ==========================================================================
  # PUBLIC
  # ==========================================================================

  /berita:
    get:
      tags:
        - Public Berita

      summary: Mendapatkan daftar berita

      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1

      responses:

        '200':
          description: Daftar berita berhasil diambil.

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Daftar berita berhasil diambil.

