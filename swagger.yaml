        no_antrian:
          type: string
          nullable: true
          example: KTP-20260914-A1B2C

        approved_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-14T08:00:00.000000Z'

        visit_date:
          type: string
          format: date
          nullable: true
          example: '2026-09-16'

        visit_date_label:
          type: string
          nullable: true
          example: Rabu, 16 September 2026

        service_hours:
          type: object
          properties:
            start:
              type: string
              example: '08:30'

            end:
              type: string
              example: '13:00'

            label:
              type: string
              example: 08.30–13.00 WIB

        expired_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-14T13:00:00.000000Z'

        expired_date:
          type: string
          nullable: true
          example: 14 Oktober 2026

        expired_time:
          type: string
          nullable: true
          example: '13:00'

        expired_datetime_label:
          type: string
          nullable: true
          example: 14 Oktober 2026 13:00

        is_expired:
          type: boolean
          example: false

        eligibility:
          type: string
          nullable: true
          enum:
            - active
            - expired
          example: active

        dokumen:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 20

              jenis_dokumen:
                type: string
                enum:
                  - kk
                  - akta_kelahiran
                  - ijazah
                  - ktp_lama
                  - pengantar_rt_rw
                  - surat_kehilangan_polsek
                example: kk

              nama_file:
                type: string
                example: kartu_keluarga.pdf

              url:
                type: string
                format: uri
                example: https://spbe-production.up.railway.app/api/files/ktp/20

        riwayat:
          type: array
