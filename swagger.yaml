openapi: 3.0.3

info:
  title: SPBE Desa Sumberporong API
  description: Dokumentasi REST API Sistem Pelayanan Berbasis Elektronik Desa Sumberporong.
  version: 1.0.0

servers:
  - url: https://spbe-production.up.railway.app/api
    description: Production Server

tags:
  - name: Authentication
    description: Autentikasi dan manajemen profil pengguna

  - name: Admin Dashboard
    description: Dashboard Admin

  - name: Super Admin Dashboard
    description: Dashboard Super Admin

  - name: Public Berita
    description: Berita yang tersedia untuk publik

  - name: Public Galeri
    description: Galeri yang tersedia untuk publik

  - name: Public UMKM
    description: UMKM yang tersedia untuk publik

  - name: Public Sambutan
    description: Sambutan Kepala Desa

  - name: Public Statistik
    description: Statistik Desa

  - name: Public Perangkat Desa
    description: Perangkat Desa yang aktif

  - name: Public Hero
    description: Hero atau banner utama website

  - name: Public Kritik & Saran
    description: Kritik dan saran masyarakat

  - name: Pengajuan KTP
    description: Pengajuan KTP dan akses dokumen KTP untuk user

  - name: Pengajuan SKU
    description: Pengajuan Surat Keterangan Usaha dan akses dokumen SKU untuk user

  - name: Pengajuan UMKM
    description: Pengajuan, pengelolaan, dan akses dokumen UMKM milik user

  - name: Pengaduan
    description: Pengaduan masyarakat dan akses file pengaduan milik user

  - name: Admin Pengajuan KTP
    description: Manajemen pengajuan KTP oleh Admin dan Super Admin

  - name: Admin Pengajuan SKU
    description: Manajemen pengajuan SKU oleh Admin dan Super Admin

  - name: Admin Pengajuan UMKM
    description: Manajemen pengajuan UMKM oleh Admin dan Super Admin

  - name: Admin Pengaduan
    description: Manajemen pengaduan masyarakat oleh Admin dan Super Admin


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Masukkan access token Sanctum dengan format Bearer {token}


  schemas:

    UserRole:
      type: object
      properties:
        id:
          type: integer
          example: 2

        name:
          type: string
          example: user


    User:
      type: object
      properties:
        id:
          type: integer
          example: 3

        name:
          type: string
          example: Ahmad Alfin Dahlin

        email:
          type: string
          format: email
          example: ahmadalfind02@gmail.com

        role:
          $ref: '#/components/schemas/UserRole'

        is_active:
          type: boolean
          example: true


    Berita:
      type: object
      properties:
        id:
          type: integer
          example: 1

        judul:
          type: string
          example: Pelayanan Digital Desa Sumberporong

        slug:
          type: string
          example: pelayanan-digital-desa-sumberporong

        isi:
          type: string
          example: Informasi mengenai pelayanan digital Desa Sumberporong.

        status:
          type: string
          enum:
            - published
          example: published

        published_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-10T10:30:00.000000Z'

        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-10T10:00:00.000000Z'

        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-10T10:30:00.000000Z'

        thumbnail:
          type: string
          format: uri
          nullable: true
          description: URL thumbnail berita yang dapat diakses publik.
          example: https://spbe-production.up.railway.app/api/files/public/berita/1

        admin_thumbnail:
          type: string
          format: uri
          nullable: true
          description: URL thumbnail untuk Admin atau Super Admin.
          example: https://spbe-production.up.railway.app/api/admin/files/berita/1

        created_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              nullable: true
              example: 2

            name:
              type: string
              nullable: true
              example: Admin Desa

        updated_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              nullable: true
              example: 2

            name:
              type: string
              nullable: true
              example: Admin Desa


    Galeri:
      type: object
      properties:
        id:
          type: integer
          example: 1

        foto:
          type: string
          format: uri
          description: URL foto galeri yang dapat diakses publik.
          example: https://spbe-production.up.railway.app/api/files/public/galeri/1

        file_path:
          type: string
          nullable: true
          description: Path file pada storage backend.
          example: galeri/qAttHg2ngogpIsNBDAjOGcLCZTKkCuulKgaCbsVE.jpg

        created_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              nullable: true
              example: 2

            name:
              type: string
              nullable: true
              example: Admin Desa

        updated_by:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              nullable: true
              example: 2

            name:
              type: string
              nullable: true
              example: Admin Desa

        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-13T09:42:00.000000Z'

        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-13T09:42:00.000000Z'


    UmkmPublic:
      type: object
      properties:
        id:
          type: integer
          example: 1

        nama_umkm:
          type: string
          example: Warung Ambarukmo

        kategori:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              nullable: true
              example: 1

            nama:
              type: string
              nullable: true
              example: Kuliner

        deskripsi_umkm:
          type: string
          nullable: true
          example: Warung makan dengan menu tradisional khas desa.

        harga_min:
          type: number
          format: double
          nullable: true
          example: 10000

        harga_max:
          type: number
          format: double
          nullable: true
          example: 25000

        alamat:
          type: string
          nullable: true
          example: Desa Sumberporong, Kecamatan Lawang, Kabupaten Malang

        jam_buka_mulai:
          type: string
          nullable: true
          example: '08:00'

        jam_buka_selesai:
          type: string
          nullable: true
          example: '21:00'

        nomor_wa:
          type: string
          nullable: true
          example: '6281234567890'

        link_ecommerce:
          type: string
          format: uri
          nullable: true
          example: https://tokopedia.com/warung-ambarukmo

        status:
          type: string
          example: disetujui

        is_active:
          type: boolean
          example: true

        foto:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1

              urutan:
                type: integer
                example: 1

              url:
                type: string
                format: uri
                example: https://spbe-production.up.railway.app/api/files/public/umkm/1

        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-10T10:00:00.000000Z'

        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-10T10:30:00.000000Z'


    Sambutan:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 1

        foto:
          type: string
          nullable: true
          example: sambutan/kepala-desa.jpg

        nama:
          type: string
          example: Kepala Desa Sumberporong

        jabatan:
          type: string
          example: Kepala Desa

        text:
          type: string
          example: Selamat datang di website resmi Desa Sumberporong.

        created_by:
          type: integer
          nullable: true
          example: 2

        updated_by:
          type: integer
          nullable: true
          example: 2

        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-13T09:00:00.000000Z'

        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-13T09:30:00.000000Z'

        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

        createdBy:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 2

            name:
              type: string
              example: Admin Desa

        updatedBy:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 2

            name:
              type: string
              example: Admin Desa


