  # ==========================================================================
  # USER - KTP
  # ==========================================================================

  /pengajuan/ktp:
    get:
      tags:
        - Pengajuan KTP

      summary: Mendapatkan riwayat pengajuan KTP

      security:
        - bearerAuth: []

      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1

      responses:

        '200':
          description: Daftar pengajuan KTP berhasil diambil.

        '401':
          description: Tidak terautentikasi.


    post:
      tags:
        - Pengajuan KTP

      summary: Membuat pengajuan KTP

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          multipart/form-data:

            schema:
              type: object

              required:
                - jenis_permohonan
                - nik
                - nama_lengkap
                - nomor_kk
                - tempat_lahir
                - tanggal_lahir
                - jenis_kelamin
                - alamat
                - rt
                - rw
                - kode_pos
                - keperluan

              properties:
                jenis_permohonan:
                  type: string
                  enum:
                    - baru
                    - hilang
                    - perpanjangan

                nik:
                  type: string
                  pattern: '^[0-9]{16}$'

                nama_lengkap:
                  type: string
                  maxLength: 100

                nomor_kk:
                  type: string
                  pattern: '^[0-9]{16}$'

                tempat_lahir:
                  type: string
                  maxLength: 100

                tanggal_lahir:
                  type: string
                  format: date

                jenis_kelamin:
                  type: string
                  enum:
                    - L
                    - P

                alamat:
                  type: string

                rt:
                  type: string
                  maxLength: 5

                rw:
                  type: string
                  maxLength: 5

                kode_pos:
                  type: string
                  maxLength: 5

                keperluan:
                  type: string
                  maxLength: 150

                dokumen[kk]:
                  type: string
                  format: binary

                dokumen[akta_kelahiran]:
                  type: string
                  format: binary

                dokumen[ijazah]:
                  type: string
                  format: binary

                dokumen[ktp_lama]:
                  type: string
                  format: binary

                dokumen[pengantar_rt_rw]:
                  type: string
                  format: binary

                dokumen[surat_kehilangan_polsek]:
                  type: string
                  format: binary

      responses:

        '201':
          description: Pengajuan KTP berhasil dibuat.

        '401':
          description: Tidak terautentikasi.

        '403':
          description: User tidak memiliki role user.

        '422':
          description: Validasi gagal atau masih memiliki pengajuan aktif.

        '500':
          description: Pengajuan KTP gagal diproses.


  /pengajuan/ktp/{pengajuanKtp}:
    get:
      tags:
        - Pengajuan KTP

      summary: Mendapatkan detail pengajuan KTP

      security:
        - bearerAuth: []

      parameters:
        - name: pengajuanKtp
          in: path
          required: true

          schema:
            type: integer
            example: 15

      responses:

        '200':
          description: Detail pengajuan KTP berhasil diambil.

        '401':
          description: Tidak terautentikasi.

        '403':
          description: Tidak memiliki akses ke pengajuan.

        '404':
          description: Pengajuan KTP tidak ditemukan.


