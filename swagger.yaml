  /admin/pengaduan/{pengaduan}/respon:
    post:
      tags:
        - Admin Pengaduan

      summary: Menambahkan respons petugas

      description: |
        Pengaduan dengan status selesai tidak dapat menerima respons baru.
        Menambahkan respons tidak otomatis mengubah status pengaduan.

      security:
        - bearerAuth: []

      parameters:
        - name: pengaduan
          in: path
          required: true

          schema:
            type: integer
            example: 5

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - respon

              properties:
                respon:
                  type: string
                  maxLength: 5000
                  example: Laporan telah diterima dan akan segera ditindaklanjuti.

      responses:

        '201':
          description: Respons petugas berhasil ditambahkan.

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Respons petugas berhasil ditambahkan.

                  data:
                    type: object

                    properties:
                      id:
                        type: integer
                        example: 7

                      user_id:
                        type: integer
                        example: 2

                      respon:
                        type: string
                        example: Laporan telah diterima dan akan segera ditindaklanjuti.

                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: '2026-09-14T10:30:00.000000Z'

        '401':
          description: Tidak terautentikasi.

        '403':
          description: Tidak memiliki role admin atau superadmin.

        '404':
          description: Pengaduan tidak ditemukan.

        '422':
          description: Pengaduan sudah selesai atau validasi gagal.

        '500':
          description: Respons petugas gagal ditambahkan.


  /admin/pengaduan/{pengaduan}/status:
    patch:
      tags:
        - Admin Pengaduan

      summary: Mengubah status pengaduan

      description: |
        Workflow status:
        terkirim -> diteruskan -> selesai

        Status selesai merupakan status final.

      security:
        - bearerAuth: []

      parameters:
        - name: pengaduan
          in: path
          required: true

          schema:
            type: integer
            example: 5

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - status

              properties:
                status:
                  type: string
                  enum:
                    - diteruskan
                    - selesai
                  example: diteruskan

      responses:

        '200':
          description: Status pengaduan berhasil diperbarui.

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Status pengaduan berhasil diperbarui.

                  data:
                    $ref: '#/components/schemas/AdminPengaduan'

        '401':
          description: Tidak terautentikasi.

        '403':
          description: Tidak memiliki role admin atau superadmin.

        '404':
          description: Pengaduan tidak ditemukan.

        '422':
          description: Status tidak valid atau transisi tidak diperbolehkan.

        '500':
          description: Status pengaduan gagal diperbarui.


