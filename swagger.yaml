        nomor_kk:
          type: string
          example: '3573********0002'

        tempat_lahir:
          type: string
          example: Malang

        tanggal_lahir:
          type: string
          format: date
          nullable: true
          example: '2003-11-27'

        jenis_kelamin:
          type: string
          enum:
            - L
            - P
          example: L

        alamat:
          type: string
          example: Jalan Raya Sumberporong No. 10

        rt:
          type: string
